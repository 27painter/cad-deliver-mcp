name: verify

# Every test in this repository was, until now, run only on the maintainer's
# Windows machine. The suites exist and they pass, but "it passes on my box" is
# the exact claim this project refuses to accept from an LLM agent, so it should
# not accept it from itself either.
#
# Three operating systems because the package is pure Python on top of `ezdxf`
# and `PyMuPDF`, both of which ship wheels everywhere. If a platform assumption
# creeps in -- a path separator, a default encoding, a COM import at module
# scope -- this is where it surfaces.
#
# Three Python versions because `pyproject.toml` claims 3.11+ and the classifiers
# list 3.11, 3.12 and 3.13. A version claim in metadata that no job checks is a
# claim nobody has verified.
#
# The `package` job exists because a passing suite says nothing about whether the
# wheel contains `standards.json` and `rules/gb/*.json`. Those are package data,
# not code: a missing entry turns every rule lookup into `UNKNOWN`, and no unit
# test would notice, because the tests import from `src/` rather than from the
# built wheel.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (MCP extra plus pytest)
        run: python -m pip install -e ".[dev]"

      - name: Run the suite
        run: python -m pytest -q

      # test_packaging.py already asserts that pyproject and __version__ agree and
      # that every classifier is on PyPI's list. This step checks the two things a
      # test cannot: that the entry points were actually installed, and that they
      # start on this platform.
      - name: Entry points respond
        shell: bash
        run: |
          python -c "import cad_deliver; print('version', cad_deliver.__version__)"
          cad-deliver --help > /dev/null
          echo "cad-deliver OK"

  package:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"

      - name: Build and validate metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # Install the built wheel into a throwaway venv and make it answer one real
      # question. If the rule JSON is missing from the wheel, this fails here
      # instead of in a user's first run.
      - name: The wheel actually gates a drawing
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/python -m pip install --quiet dist/*.whl
          /tmp/probe/bin/python -c "from cad_deliver.pipeline import verify_file; r = verify_file('benchmarks/fixtures/real/PART-001.DXF', profile='GB_T_TIER1'); print('verdict', r.verdict.value, 'checks', len(r.checks), 'rules', len(r.rules)); assert r.rules, 'no rules ran - rule data missing from the wheel'"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
