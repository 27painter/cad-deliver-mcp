[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-deliver-mcp"
version = "0.2.0"
description = "Pre-delivery gatekeeper for CAD files: stage, verify offline, then commit. MCP server plus a CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "27painter" }]
keywords = ["mcp", "cad", "dxf", "step", "pdf", "delivery", "verification", "gb"]
# Every entry here must appear in https://pypi.org/pypi?%3Aaction=list_classifiers.
# PyPI validates them and rejects the whole upload with a 400 — twine check does not,
# so a bad classifier only surfaces at upload time. There is no CAD topic classifier.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# The two readers a delivery check almost always needs. They are default
# dependencies rather than extras because a checker that can only answer
# "UNKNOWN" is not useful: without ezdxf every DXF, and without PyMuPDF every
# PDF, becomes unjudgeable — and UNKNOWN is deliberately not a pass. A host that
# genuinely wants the minimal install can still `pip install --no-deps`.
dependencies = [
    "ezdxf>=1.3",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# The MCP server is the optional part: a CLI user never imports it.
mcp = ["mcp>=1.20"]
# The suites also run as plain scripts (`python tests/test_rules.py`), so pytest is
# a convenience for collection, not a requirement.
dev = ["mcp>=1.20", "pytest>=8"]

[project.scripts]
cad-deliver = "cad_deliver.cli:main"
cad-deliver-mcp = "cad_deliver.server:main"

[project.urls]
Homepage = "https://github.com/27painter/cad-deliver-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_deliver = ["standards.json", "rules/gb/*.json"]